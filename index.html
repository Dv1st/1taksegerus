<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Полный справочник: Части речи и средства связи</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #2c3e50;
            --bg-color: #f5f7fa;
            --card-front-bg: #ffffff;
            --card-back-bg: #e8f0fe;
            --text-color: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--secondary-color);
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        /* Панель фильтров */
        .filters {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid var(--primary-color);
            background-color: transparent;
            color: var(--primary-color);
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        /* Кнопка случайного режима */
        .filter-btn.random-btn {
            border-color: #e67e22;
            color: #e67e22;
        }
        
        .filter-btn.random-btn:hover, .filter-btn.random-btn.active {
            background-color: #e67e22;
            color: white;
        }

        /* Сетка карточек */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- Режим случайной карточки --- */
        .random-mode-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 40px auto;
            max-width: 450px;
        }

        .random-mode-container .card {
            width: 100%;
            height: 350px;
        }

        .next-card-btn {
            margin-top: 25px;
            padding: 12px 30px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(46, 204, 113, 0.3);
            transition: transform 0.2s, background-color 0.2s;
        }

        .next-card-btn:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
        }
        
        .next-card-btn:active {
            transform: translateY(0);
        }

        /* --- Общие стили карточки --- */
        .card {
            background-color: transparent;
            height: 260px; /* Увеличили высоту, так как текста стало больше */
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 12px;
        }

        .card.is-flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
        }

        .card-front {
            background-color: var(--card-front-bg);
            border: 2px solid var(--primary-color);
            color: var(--secondary-color);
        }

        .card-back {
            background-color: var(--card-back-bg);
            color: var(--text-color);
            transform: rotateY(180deg);
            border: 2px solid var(--secondary-color);
            font-size: 0.95rem;
            line-height: 1.5;
            text-align: left; /* Текст на обороте лучше читается слева */
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }

        .card-hint {
            font-size: 0.8rem;
            color: #888;
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
        }

        .card-back strong {
            color: var(--primary-color);
        }
        
        /* Скроллбар для обратной стороны */
        .card-back::-webkit-scrollbar { width: 6px; }
        .card-back::-webkit-scrollbar-thumb { background-color: #ccc; border-radius: 3px; }
        
        /* Анимация появления */
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Средства связи и части речи</h1>
        <p>Полный справочник по вашим таблицам</p>
    </header>

    <div class="filters" id="filters">
        <button class="filter-btn active" data-filter="all">Все карточки</button>
        <button class="filter-btn" data-filter="Союзы">Союзы</button>
        <button class="filter-btn" data-filter="Предлоги">Предлоги</button>
        <button class="filter-btn" data-filter="Вводные слова">Вводные слова</button>
        <button class="filter-btn" data-filter="Частицы">Частицы</button>
        <button class="filter-btn" data-filter="Местоимения">Местоимения</button>
        <button class="filter-btn" data-filter="Наречия">Наречия</button>
        <button class="filter-btn random-btn" id="toggle-random">🎲 Случайная карточка</button>
    </div>

    <div class="cards-container" id="cards-container"></div>

    <div class="random-mode-container" id="random-container">
        <div class="card" id="single-random-card"></div>
        <button class="next-card-btn" id="next-btn">Следующая карточка ➔</button>
    </div>

    <script>
        // ПОЛНЫЙ МАССИВ ДАННЫХ ИЗ ВСЕХ 4-Х ФОТО
        const cardsData = [

            { category: "Союзы", title: "Сочинительные: Пояснительные", content: "<strong>Слова:</strong> ТО ЕСТЬ, А ИМЕННО<br><br><strong>Пример:</strong> Я вернусь через два дня, <i>то есть</i> в воскресенье." },
            { category: "Союзы", title: "Сочинительные: Присоединительные", content: "<strong>Слова:</strong> ДА И, А ТАКЖЕ, ПРИТОМ<br><br><strong>Пример:</strong> Она умна, <i>притом</i> красива." },
            { category: "Союзы", title: "Двойные союзы", content: "<strong>Слова:</strong> КАК... ТАК И, ХОТЯ И... НО, НЕ ТОЛЬКО... НО И, НЕ СТОЛЬКО... СКОЛЬКО, ЕСЛИ НЕ... ТО<br><br><strong>Пример:</strong> День был <i>хотя и</i> пасмурный, <i>но</i> тёплый." },

            { category: "Союзы", title: "Подчинительные: Следствия", content: "<strong>Слова:</strong> ТАК ЧТО, ВСЛЕДСТВИЕ ЧЕГО...<br><br><strong>Пример:</strong> Потеплело, <i>так что</i> снег начал таять." },
            { category: "Союзы", title: "Подчинительные: Сравнительные", content: "<strong>Слова:</strong> КАК, СЛОВНО, БУДТО, ТОЧНО, КАК БУДТО...<br><br><strong>Пример:</strong> Послышался высокий звук, <i>словно</i> кто-то пел." },

            // ================= ПРЕДЛОГИ =================

            { category: "Предлоги", title: "Производные (наречные)", content: "<strong>Слова:</strong> ОКОЛО, МИМО, НАВСТРЕЧУ, ВОКРУГ, ВДОЛЬ, ПОСЛЕ, НАПРОТИВ, ВБЛИЗИ, ВМЕСТО, СВЕРХ, НАПОДОБИЕ." },

            // ================= ВВОДНЫЕ СЛОВА =================

            { category: "Вводные слова", title: "Вводные: Порядок мыслей", content: "<strong>Слова:</strong> ВО-ПЕРВЫХ, ВО-ВТОРЫХ, ПРЕЖДЕ ВСЕГО, НАКОНЕЦ, НАПРОТИВ, НАОБОРОТ, С ОДНОЙ СТОРОНЫ, С ДРУГОЙ СТОРОНЫ." },
            { category: "Вводные слова", title: "Вводные: Следствие, вывод", content: "<strong>Слова:</strong> ЗНАЧИТ, ИТАК, СЛЕДОВАТЕЛЬНО, ИНЫМИ СЛОВАМИ, ИНАЧЕ ГОВОРЯ." },
            { category: "Вводные слова", title: "Вводные: Ссылка на примеры", content: "<strong>Слова:</strong> НАПРИМЕР, В ЧАСТНОСТИ, К ПРИМЕРУ, ТАКИМ ОБРАЗОМ, В КОНЦЕ КОНЦОВ." },
            { category: "Вводные слова", title: "Вводные: Обобщение", content: "<strong>Слова:</strong> СЛОВОМ, ОДНИМ СЛОВОМ, ИНЫМИ СЛОВАМИ, ДРУГИМИ СЛОВАМИ, ИТОГОВ, ВЫВОД." },

            // ================= ЧАСТИЦЫ =================
            { category: "Частицы", title: "Частицы: Указательные", content: "<strong>Слова:</strong> ВОТ, ВОН, ЭТО" },
            { category: "Частицы", title: "Частицы: Уточняющие", content: "<strong>Слова:</strong> ИМЕННО, КАК РАЗ, ТОЛЬКО, ЛИШЬ, ЕДИНСТВЕННО, ИСКЛЮЧИТЕЛЬНО" },
            { category: "Частицы", title: "Частицы: Ограничительные", content: "<strong>Слова:</strong> ТОЛЬКО, ЛИШЬ" },
            { category: "Частицы", title: "Частицы: Усилительные", content: "<strong>Слова:</strong> ДАЖЕ, ЖЕ, ВЕДЬ, ВСЁ, ВСЁ-ТАКИ, УЖ" },
            { category: "Частицы", title: "Частицы: Выражающие сомнение", content: "<strong>Слова:</strong> ВРЯД ЛИ, ЕДВА ЛИ" },

            // ================= МЕСТОИМЕНИЯ =================
            { category: "Местоимения", title: "Разряды: Личные", content: "<strong>Слова:</strong> Я, МЫ, ТЫ, ВЫ, ОН, ОНА, ОНО, ОНИ" },
            { category: "Местоимения", title: "Разряды: Возвратное", content: "<strong>Слова:</strong> СЕБЯ" },
            { category: "Местоимения", title: "Разряды: Притяжательные", content: "<strong>Слова:</strong> МОЙ, НАШ, ТВОЙ, ВАШ, ЕГО, ЕЁ, ИХ, СВОЙ" },
            { category: "Местоимения", title: "Разряды: Указательные", content: "<strong>Слова:</strong> ТОТ, ЭТОТ, ТАКОЙ, ТАКОВ, ТА, ТЕ, ЭТИ..." },
            { category: "Местоимения", title: "Разряды: Вопросительные (с.сл.)", content: "<strong>Слова:</strong> КТО, ЧТО, КАКОЙ, ЧЕЙ, СКОЛЬКО, КОТОРЫЙ" },
            { category: "Местоимения", title: "Разряды: Относительные", content: "<strong>Слова:</strong> КТО, ЧТО, КАКОЙ, ЧЕЙ, СКОЛЬКО, КОТОРЫЙ<br><br><i>(Те же слова, что и вопросительные, но служат для связи частей сложного предложения)</i>" },
            { category: "Местоимения", title: "Разряды: Неопределенные", content: "<strong>Слова:</strong> НЕКТО, КАКОЙ-ТО, ЧЕЙ-ЛИБО, ЧТО-НИБУДЬ..." },
            { category: "Местоимения", title: "Разряды: Отрицательные", content: "<strong>Слова:</strong> НИКТО, НИЧТО, НИКАКОЙ, НЕКОГО, НЕЧЕГО, НИСКОЛЬКО..." },
            { category: "Местоимения", title: "Разряды: Определительные", content: "<strong>Слова:</strong> ВЕСЬ, ВСЯКИЙ, САМ, САМЫЙ, КАЖДЫЙ, ИНОЙ, ЛЮБОЙ, ДРУГОЙ" },

            // ================= НАРЕЧИЯ =================
            { category: "Наречия", title: "Наречия: Порядок, время", content: "<strong>Слова:</strong> СНАЧАЛА, ДАЛЕЕ, ПОТОМ..." },

            { category: "Наречия", title: "Наречия: Степени", content: "<strong>Слова:</strong> ПОЧТИ, ПРИМЕРНО, НАСТОЛЬКО, СТОЛЬ" },
            { category: "Наречия", title: "Наречия: Указательные", content: "<strong>Слова:</strong> ТАМ, ТУТ, ЗДЕСЬ, ТАК" },
            { category: "Наречия", title: "Наречия: Относительные (союзные слова)", content: "<strong>Слова:</strong> ГДЕ, КУДА, КОГДА, ОТКУДА, ПОЧЕМУ, ЗАЧЕМ, КАК" },
            { category: "Наречия", title: "Местоименные наречия: Указательные", content: "<strong>Слова:</strong> ЗДЕСЬ, ТАМ, ТУТ, ТУДА, ТАК, ОТТУДА, ПОЭТОМУ" },
            { category: "Наречия", title: "Местоименные наречия: Вопросительные", content: "<strong>Слова:</strong> ГДЕ? КУДА? КОГДА? ОТКУДА? ПОЧЕМУ? ЗАЧЕМ? КАК? ОТЧЕГО?" },
            { category: "Наречия", title: "Местоименные наречия: Относительные", content: "<strong>Слова:</strong> ГДЕ, КУДА, КОГДА, ОТКУДА, ПОЧЕМУ, ЗАЧЕМ, КАК, ОТЧЕГО" },
            { category: "Наречия", title: "Местоименные наречия: Неопределенные", content: "<strong>Слова:</strong> ГДЕ-ТО, КУДА-ТО, КАК-НИБУДЬ, КОЕ-ГДЕ, КУДА-ЛИБО, КОЕ-КАК..." },
            { category: "Наречия", title: "Местоименные наречия: Отрицательные", content: "<strong>Слова:</strong> НИГДЕ, НИКУДА, НИКОГДА, НЕГДЕ, НЕКУДА, НЕЗАЧЕМ, НИКАК..." },
            { category: "Наречия", title: "Местоименные наречия: Определительные", content: "<strong>Слова:</strong> ВЕЗДЕ, ВСЮДУ, ОТОВСЮДУ, ВСЕГДА, ВСЯЧЕСКИ, ИНОГДА..." }
        ];

        const container = document.getElementById('cards-container');
        const randomContainer = document.getElementById('random-container');
        const randomCardDiv = document.getElementById('single-random-card');
        const nextBtn = document.getElementById('next-btn');
        const toggleRandomBtn = document.getElementById('toggle-random');
        const filterBtns = document.querySelectorAll('.filter-btn:not(.random-btn)');

        let currentFilter = 'all';
        let isRandomMode = false;

        function getFilteredCards() {
            return currentFilter === 'all' 
                ? cardsData 
                : cardsData.filter(card => card.category === currentFilter);
        }

        function renderGrid() {
            container.innerHTML = '';
            const filteredData = getFilteredCards();

            filteredData.forEach(card => {
                const cardElement = document.createElement('div');
                cardElement.className = 'card';
                cardElement.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">
                            <div class="card-title">${card.title}</div>
                            <div class="card-hint">Нажмите, чтобы перевернуть</div>
                        </div>
                        <div class="card-back">
                            <div>${card.content}</div>
                        </div>
                    </div>
                `;
                
                cardElement.addEventListener('click', () => {
                    cardElement.classList.toggle('is-flipped');
                });

                container.appendChild(cardElement);
            });
        }

        function renderRandomCard() {
            const filteredData = getFilteredCards();
            if (filteredData.length === 0) return;

            const randomIndex = Math.floor(Math.random() * filteredData.length);
            const cardData = filteredData[randomIndex];

            randomCardDiv.className = 'card fade-in';
            randomCardDiv.innerHTML = `
                <div class="card-inner">
                    <div class="card-front">
                        <div class="card-title">${cardData.title}</div>
                        <div class="card-hint">Нажмите, чтобы перевернуть</div>
                    </div>
                    <div class="card-back">
                        <div>${cardData.content}</div>
                    </div>
                </div>
            `;

            randomCardDiv.onclick = function() {
                this.classList.toggle('is-flipped');
            };
            
            void randomCardDiv.offsetWidth;
            randomCardDiv.classList.add('fade-in');
        }

        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                currentFilter = e.target.dataset.filter;
                
                if (isRandomMode) {
                    renderRandomCard(); 
                } else {
                    renderGrid(); 
                }
            });
        });

        toggleRandomBtn.addEventListener('click', () => {
            isRandomMode = !isRandomMode;

            if (isRandomMode) {
                toggleRandomBtn.classList.add('active');
                toggleRandomBtn.textContent = "📚 Вернуться к сетке";
                container.style.display = 'none';
                randomContainer.style.display = 'flex';
                renderRandomCard();
            } else {
                toggleRandomBtn.classList.remove('active');
                toggleRandomBtn.textContent = "🎲 Случайная карточка";
                container.style.display = 'grid';
                randomContainer.style.display = 'none';
                renderGrid();
            }
        });

        nextBtn.addEventListener('click', () => {
            renderRandomCard();
        });

        // Запуск при загрузке
        renderGrid();
    </script>
</body>
</html>
